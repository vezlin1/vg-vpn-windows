<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="70 80 980 260">
  <title>VG VPN Wordmark</title>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f2f2f4"/>
      <stop offset="100%" stop-color="#aeb0b7"/>
    </linearGradient>
    <linearGradient id="vpnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a43ff"/>
      <stop offset="48%" stop-color="#704cff"/>
      <stop offset="100%" stop-color="#2f7dff"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0A0D1F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)" font-family="Arial Black, Montserrat, Inter, Arial, sans-serif" font-weight="900" font-size="210" letter-spacing="-12">
    <text x="115" y="278" fill="url(#silver)">VG</text>
    <text x="505" y="278" fill="url(#vpnGrad)">VPN</text>
  </g>
</svg>
